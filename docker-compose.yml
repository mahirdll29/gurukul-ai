services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: ./.env
        required: false
      - path: ./server/.env
        required: false
    environment:
      WORKER_MODE: external
      DIRECT_UPLOAD: "true"
      CLIENT_ORIGIN: http://localhost:8080
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: ./.env
        required: false
      - path: ./server/.env
        required: false
    environment:
      WORKER_MODE: external
    command: ["node", "server/dist/worker.js"]
    depends_on:
      api:
        condition: service_healthy
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports: ["8080:80"]
    depends_on: [api]
